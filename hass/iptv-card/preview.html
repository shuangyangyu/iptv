<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IPTV Card Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e8eaed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .frame {
      width: min(420px, 92vw);
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(0,0,0,.12);
      overflow: hidden;
    }
    .bar {
      padding: 10px 14px;
      font-size: 12px;
      color: #666;
      border-bottom: 1px solid #eee;
      background: #fafafa;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="bar">预览 · IPTV Control Card v1.3.2</div>
    <div id="host"></div>
  </div>
  <script>
    // 最小 HA mock，让卡片能渲染
    class MockHass {
      constructor() {
        this.states = {
          "binary_sensor.iptv_241_health": { state: "on" },
          "binary_sensor.iptv_241_udpxy_running": { state: "on" },
          "binary_sensor.iptv_241_network_ok": { state: "on" },
          "sensor.iptv_241_udpxy_connections": { state: "3" },
          "sensor.iptv_241_m3u_mtime": { state: "28/07/2026 15:02" },
          "sensor.iptv_241_epg_mtime": { state: "28/07/2026 11:40" },
          "sensor.iptv_241_m3u_url": { state: "http://192.168.1.241:8088/out/iptv.m3u" },
          "sensor.iptv_241_m3u_aptv_url": { state: "http://192.168.1.241:8088/out/iptv-aptv.m3u" },
          "sensor.iptv_241_epg_url": { state: "http://192.168.1.241:8088/out/epg.xml" },
          "sensor.iptv_241_network_summary": {
            state: "OK",
            attributes: { ok: true, detail: "✓ local_iface\n✓ source_iface", at: "1" },
          },
          "button.iptv_241_generate": { state: "unknown" },
          "button.iptv_241_network_diag": { state: "unknown" },
          "button.iptv_241_run_m3u": { state: "unknown" },
          "button.iptv_241_run_epg": { state: "unknown" },
          "button.iptv_241_run_logos": { state: "unknown" },
          "button.iptv_241_udpxy_restart": { state: "unknown" },
        };
      }
      callService() { return Promise.resolve(); }
    }

    // ha-card stub
    class HaCard extends HTMLElement {
      constructor() {
        super();
        this.style.display = "block";
        this.style.background = "#fff";
        this.style.color = "#222";
      }
    }
    customElements.define("ha-card", HaCard);

    const s = document.createElement("script");
    s.src = "./iptv-card.js?v=1.3.1";
    s.onload = () => {
      const el = document.createElement("iptv-control-card");
      el.setConfig({ type: "custom:iptv-control-card", prefix: "iptv_241", title: "IPTV 电视直播系统" });
      el.hass = new MockHass();
      document.getElementById("host").appendChild(el);
    };
    document.head.appendChild(s);
  </script>
</body>
</html>

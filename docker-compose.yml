services:
  iptv:
    image: shuangyangyu/iptv-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: iptv
    network_mode: host
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - iptv_out_data:/app/iptv_sever/out
    environment:
      - CONFIG_PATH=/app/config.yaml
      - API_PORT=8088
      - API_HOST=0.0.0.0
      - LOG_LEVEL=INFO
      # - MQTT_PASSWORD=
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  iptv_out_data:
    driver: local
